# ---------------------------------------------------------------------------
# Root Types
# ---------------------------------------------------------------------------

type Query {
  """Track a shipment by tracking number."""
  trackShipment(
    trackingNumber: String!
    shipDateBegin: String
    shipDateEnd: String
    accountNumber: String
  ): TrackingDetails

  """Track multiple shipments by a list of tracking numbers."""
  trackShipments(
    trackingNumbers: [String!]!
    accountNumber: String
  ): [TrackingDetails]

  """Track by customer reference number."""
  trackByReference(
    referenceNumber: String!
    accountNumber: String!
    shipDateBegin: String
    shipDateEnd: String
  ): [TrackingDetails]

  """Get rate quotes for a proposed shipment."""
  getRates(
    accountNumber: String!
    serviceType: ServiceType
    packagingType: PackageType
    shipDate: Date
    originAddress: AddressInput!
    destinationAddress: AddressInput!
    packages: [PackageDetailsInput!]!
    rateTypes: [String]
  ): RateReply

  """Validate a postal address."""
  validateAddress(address: AddressInput!): AddressValidationResult

  """Find FedEx locations near an address."""
  findLocations(
    address: AddressInput!
    radiusDistance: Decimal
    radiusUnit: String
    locationTypes: [LocationType]
    services: [String]
    maxResults: Int
  ): [ServiceCenter]

  """Check pickup availability for an origin address."""
  getPickupAvailability(
    countryCode: String!
    postalCode: String!
    accountNumber: String!
    pickupDate: Date
    packageCount: Int
    weight: WeightInput
  ): PickupAvailability

  """List registered webhooks for an account."""
  listWebhooks(accountNumber: String!): [Webhook]

  """Get details for a specific webhook."""
  getWebhook(webhookId: String!, accountNumber: String!): Webhook

  """Get available FedEx services for an origin-destination pair."""
  getAvailableServices(
    originAddress: AddressInput!
    destinationAddress: AddressInput!
    accountNumber: String
  ): [Service]

  """Retrieve proof of delivery for a delivered shipment."""
  getProofOfDelivery(
    trackingNumber: String!
    accountNumber: String!
  ): POD
}

type Mutation {
  """Create a shipment and generate shipping label(s)."""
  createShipment(request: CreateShipmentRequest!): CreateShipmentReply

  """Cancel a shipment by tracking number."""
  cancelShipment(
    trackingNumber: String!
    accountNumber: String!
  ): Boolean

  """Create a return shipment and label."""
  createReturnShipment(request: ReturnShipmentRequest!): CreateShipmentReply

  """Schedule a package pickup."""
  schedulePickup(
    accountNumber: String!
    address: AddressInput!
    contact: ContactInput!
    readyDateTime: DateTime!
    closeTime: String!
    packageCount: Int
    totalWeight: WeightInput
    remarks: String
  ): PickupConfirmation

  """Cancel a scheduled pickup."""
  cancelPickup(
    confirmationNumber: String!
    accountNumber: String!
    scheduledDate: Date!
    location: String
  ): Boolean

  """Register a webhook for shipment visibility events."""
  registerWebhook(
    endpoint: String!
    eventTypes: [WebhookEventType!]!
    accountNumber: String!
  ): Webhook

  """Update an existing webhook registration."""
  updateWebhook(
    webhookId: String!
    endpoint: String
    eventTypes: [WebhookEventType]
    active: Boolean
    accountNumber: String!
  ): Webhook

  """Delete a registered webhook."""
  deleteWebhook(
    webhookId: String!
    accountNumber: String!
  ): Boolean

  """Generate an OAuth 2.0 access token."""
  generateToken(
    clientId: String!
    clientSecret: String!
  ): Token
}
