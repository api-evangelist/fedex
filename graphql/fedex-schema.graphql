"""
FedEx GraphQL Schema
Conceptual schema derived from the FedEx Web Services REST API surface.
Source: https://developer.fedex.com/
Covers: Track, Ship, Rate, Address Validation, Pickup, Locations, Authorization, Webhooks
"""

